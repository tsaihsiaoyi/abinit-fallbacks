name: Build abinit-fallbacks with oneapi

on:
  push:
    branches: [actions]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout abinit-fallbacks repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y autoconf automake m4
        sudo apt install -y libxml2-dev
        sudo apt install -y build-essential zlib1g-dev

        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
        | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list

        sudo apt update
        sudo apt install -y intel-oneapi-base-toolkit intel-oneapi-hpc-toolkit
        source /opt/intel/oneapi/setvars.sh

        printenv >> $GITHUB_ENV

    - name: Run autogen
      run: ./autogen.sh

    - name: Run configure
      run: |
        mkdir -p build
        cd build
        ../configure FC=mpiifx CC=mpiicx CXX=mpiicpx --disable-linalg --prefix=$HOME --with-linalg-libs="-L${MKLROOT}/lib -lmkl_scalapack_lp64 -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lmkl_blacs_intelmpi_lp64 -lpthread -lm -ldl"

    - name: Run make
      run: |
        cd build
        make
